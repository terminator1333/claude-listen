<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#0d0d12"/>

  <!-- Wordmark -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-weight="700">
    <text x="100" y="240" font-size="112" fill="#f5f5f0" letter-spacing="-3">
      <tspan fill="#cc785c">/</tspan>listen
    </text>
  </g>

  <!-- Waveform aligned with wordmark baseline -->
  <g fill="#cc785c" transform="translate(640, 170)">
    <rect x="0"   y="38" width="16" height="22" rx="3"/>
    <rect x="26"  y="22" width="16" height="54" rx="3"/>
    <rect x="52"  y="6"  width="16" height="86" rx="3"/>
    <rect x="78"  y="-8" width="16" height="114" rx="3"/>
    <rect x="104" y="14" width="16" height="70" rx="3"/>
    <rect x="130" y="34" width="16" height="30" rx="3"/>
  </g>

  <!-- Tagline: two lines, both well under the 1280 width -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-weight="500">
    <text x="100" y="370" font-size="36" fill="#f5f5f0" opacity="0.92">
      Drop a meeting recording in.
    </text>
    <text x="100" y="420" font-size="36" fill="#f5f5f0" opacity="0.92">
      Speaker-labeled transcripts. Project-aware notes.
    </text>
  </g>

  <!-- Bottom strip: literal spacing preserved -->
  <text x="100" y="552" font-size="24" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-weight="500" fill="#f5f5f0" opacity="0.55" xml:space="preserve"><tspan fill="#cc785c" opacity="0.85">Claude Code skill</tspan>   ·   faster-whisper   ·   pyannote.audio   ·   local-only</text>
</svg>
