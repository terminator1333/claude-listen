<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="40" fill="#0d0d12"/>

  <!-- Slash: dominant leading peak, sits on the same baseline (y=200) as the bars -->
  <line x1="60" y1="200" x2="120" y2="60" stroke="#cc785c" stroke-width="22" stroke-linecap="round"/>

  <!-- Trailing waveform: heights decay/echo to the right -->
  <g fill="#cc785c">
    <rect x="138" y="110" width="14" height="90"  rx="3"/>
    <rect x="160" y="138" width="14" height="62"  rx="3"/>
    <rect x="182" y="124" width="14" height="76"  rx="3"/>
    <rect x="204" y="158" width="14" height="42"  rx="3"/>
  </g>
</svg>
